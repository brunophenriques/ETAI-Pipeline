# Baseline pipeline configuration.
# Everything tunable is kept in this configuration file.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"

  # Columns excluded from the model features
  drop_columns:
    - "id"
    - "decile_score"
    - "score_text"


diagnostics:
  id_column: "id"

  # Values interpreted as missing
  placeholder_tokens:
    - ""
    - "-"
    - "?"
    - "N/A"
    - "NA"
    - "n/a"
    - "na"

  # Missingness classification found during diagnostics
  missingness_verdicts:
    age: "MCAR"
    juv_fel_count: "MCAR"
    priors_count: "MNAR"
    c_charge_degree: "MNAR"
    race: "MCAR"
    sex: "MCAR"

  # Valid ranges for numerical variables
  validity_rules:
    age:
      min: 18
      max: 100

    decile_score:
      min: 1
      max: 10

    juv_fel_count:
      min: 0

    priors_count:
      min: 0
      max: 60

  # Columns that should contain numerical values
  numerical_columns:
    - "age"
    - "decile_score"
    - "juv_fel_count"
    - "priors_count"

  # Standard mappings for categorical values
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"

    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"

    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"

    race:
      african-american: "African-American"
      african american: "African-American"
      asian: "Asian"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      native american: "Native American"
      other: "Other"

  # Redundant or unnecessary columns
  columns_to_drop:
    - "prior_offenses"
    - "age_in_months"
    - "juvenile_total"
    - "id"

  # Duplicate information found during diagnostics
  duplicate_check:
    exact_row_duplicates: 72
    repeated_ids: 72


preprocessing:
  # Fixed formulas after cleaning; numeric columns are detected automatically.
  engineered_features:
    enabled: true

  # Scale before imputation: none, standard, or robust.
  # KNN requires standard or robust so distances use comparable units.
  scaler: "standard"

  # Numeric strategies: median, mean, most_frequent, constant, or knn.
  numerical_imputation: "median"
  n_neighbors: 5  # Used only by knn; uniform-weight neighbor averaging.

  # Mode for sex and c_charge_degree
  categorical_imputation: "most_frequent"

  # MNAR columns that require missingness indicators
  missing_indicator_columns:
    - "priors_count"
    - "c_charge_degree"

  # Fairness columns kept outside the model that require mode imputation
  extra_columns_to_impute:
    - "race"


# Reserved final test set: keep these settings fixed during model comparisons.
split:
  test_size: 0.2
  random_state: 42


cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"
  n_jobs: -1


tuning:
  enabled: true
  n_trials: 50  # Final comparison budget; use 5 while testing code changes.
  n_splits: 5       # Inner CV: evaluates each trial
  random_state: 42  # Seeds inner CV and Optuna's TPE sampler

  search_spaces:
    adaboost_logistic_regression:
      classifier__estimator__C:
        type: float
        low: 0.0001
        high: 100
        log: true

      classifier__n_estimators:
        type: int
        low: 25
        high: 400
        log: true

      classifier__learning_rate:
        type: float
        low: 0.01
        high: 1.0
        log: true

    adaboost:
      classifier__estimator__max_depth:
        type: int
        low: 1
        high: 8

      classifier__n_estimators:
        type: int
        low: 25
        high: 400
        log: true

      classifier__learning_rate:
        type: float
        low: 0.01
        high: 1.0
        log: true

    oblique_random_forest:
      classifier__estimator__tree__max_depth:
        type: int
        low: 2
        high: 30

      classifier__estimator__tree__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true

      classifier__estimator__project__n_components:
        type: int
        low: 3
        high: 10

    random_forest:
      classifier__n_estimators:
        type: int
        low: 100
        high: 500

      classifier__max_depth:
        type: categorical
        choices: [null, 3, 5, 8, 12, 20]

      classifier__min_samples_leaf:
        type: int
        low: 1
        high: 100
        log: true

      classifier__max_features:
        type: categorical
        choices: ["sqrt", "log2", null]

    logistic_regression:
      classifier__C:
        type: float
        low: 0.0001
        high: 100
        log: true

    decision_tree:
      classifier__max_depth:
        type: int
        low: 1
        high: 20

      classifier__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true

      classifier__criterion:
        type: categorical
        choices: ["gini", "entropy"]


imputation_comparison:
  # Fixed in advance; all holdouts come from development data only.
  holdout_seeds: [0, 42, 123]
  validation_size: 0.25


# Supported types: dummy, logistic_regression, decision_tree, random_forest,
# oblique_random_forest, adaboost, adaboost_logistic_regression.
# Replace the entire model block (including params) when switching models.
model:
  type: "adaboost_logistic_regression"
  params:
    C: 1.0
    max_iter: 2000
    n_estimators: 50
    learning_rate: 1.0
    random_state: 42


