# Baseline pipeline configuration.
# Everything tunable is kept in this configuration file.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"

  # Columns excluded from the model features
  drop_columns:
    - "id"
    - "decile_score"
    - "score_text"


diagnostics:
  id_column: "id"

  # Values interpreted as missing
  placeholder_tokens:
    - ""
    - "-"
    - "?"
    - "N/A"
    - "NA"
    - "n/a"
    - "na"

  # Missingness classification found during diagnostics
  missingness_verdicts:
    age: "MCAR"
    juv_fel_count: "MCAR"
    priors_count: "MNAR"
    c_charge_degree: "MNAR"
    race: "MCAR"
    sex: "MCAR"

  # Valid ranges for numerical variables
  validity_rules:
    age:
      min: 18
      max: 100

    decile_score:
      min: 1
      max: 10

    juv_fel_count:
      min: 0

    priors_count:
      min: 0
      max: 60

  # Columns that should contain numerical values
  numerical_columns:
    - "age"
    - "decile_score"
    - "juv_fel_count"
    - "priors_count"

  # Standard mappings for categorical values
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"

    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"

    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"

    race:
      african-american: "African-American"
      african american: "African-American"
      asian: "Asian"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      native american: "Native American"
      other: "Other"

  # Redundant or unnecessary columns
  columns_to_drop:
    - "prior_offenses"
    - "age_in_months"
    - "juvenile_total"
    - "id"

  # Duplicate information found during diagnostics
  duplicate_check:
    exact_row_duplicates: 72
    repeated_ids: 72


preprocessing:
  # Median for age, juv_fel_count, and priors_count
  numerical_imputation: "median"

  # Mode for sex and c_charge_degree
  categorical_imputation: "most_frequent"

  # MNAR columns that require missingness indicators
  missing_indicator_columns:
    - "priors_count"
    - "c_charge_degree"

  # Fairness columns kept outside the model that require mode imputation
  extra_columns_to_impute:
    - "race"


split:
  test_size: 0.2
  random_state: 42


model:
  type: "decision_tree"
  params:
    max_depth: 5
    min_samples_split: 10
    min_samples_leaf: 5
    random_state: 42


output:
  results_dir: "results"